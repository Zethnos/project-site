    <!-- MAIN CONTENT -->
    <div class="container" id="twitch_stats">
      <h2>Zeth's Twitch Stats</h2>
      <h4>Range: 30 Days | Last Updated: Today</h4>
      <div class="row justify-content-center">
        <section class="minor-card stats">
          <h3>Followers</h3>
          <div class="stat">
            <span id="followers" class="value">—</span>
          </div>
        </section>
        <section class="minor-card stats">
          <h3>Avg Viewers</h3>
          <div class="stat">
            <span id="avg-viewers-30d" class="value">—</span>
          </div>
        </section>
        <section class="minor-card stats">
          <h3>Median Viewers</h3>
          <div class="stat">
            <span id="median-viewers-30d" class="value">—</span>
          </div>
        </section>
        <section class="minor-card stats">
          <h3>Peak Viewers</h3>
          <div class="stat">
            <span id="peak-viewers-30d" class="value">—</span>
          </div>
        </section>
        <section class="minor-card stats">
          <h3>Hours Streamed</h3>
          <div class="stat">
            <span id="hours-streamed-30d" class="value">—</span>
          </div>
        </section>
        <section class="minor-card stats">
          <h3>Avg Stream Length</h3>
          <div class="stat">
            <span id="avg-stream-length" class="value">—</span>
          </div>
        </section>
        <div class="card-container">
          <section class="logo-card">
            <img src="img/logo.png" alt="Zethnos Logo" />
          </section>
        </div>
      </div>
    </div>
    <div class="row sponsors">
      <h1>Sponsors & Partners</h1>
      <div class="card-container">
        <section class="minor-card">
          <img src="img/logo.png" alt="Zethnos Logo" />
        </section>
        <section class="minor-card">
          <img src="img/logo.png" alt="Zethnos Logo" />
        </section>
      </div>
    </div>
    <div class="row sponsors">
      <h1>Past Affiliations</h1>
      <div class="card-container">
        <section class="minor-card">
          <img src="img/logo.png" alt="Zethnos Logo" />
        </section>
        <section class="minor-card">
          <img src="img/logo.png" alt="Zethnos Logo" />
        </section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
