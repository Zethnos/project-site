<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zethnos Stats</title>

    <meta
      name="description"
      content="Zethnos's statistics on viewer growth, engagement, and community impact."
    />

    <meta property="og:title" content="Zethnos Stats" />
    <meta
      property="og:description"
      content="Explore Zethnos's statistics on viewer growth, engagement, and community impact."
    />
    <meta
      property="og:image"
      content="https://www.zethnos.com/images/freelance-og-image.jpg"
    />
    <meta property="og:url" content="https://www.zethnos.com/freelance.html" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="canonical" href="https://www.zethnos.com/freelance.html" />
    <link rel="icon" type="image/x-icon" href="img/favicon/favicon.ico" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- NAV -->
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="gallery.html">Art Gallery</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="shop.html">Shop</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="card-container">

      <!-- STATS CARD -->
      <section class="zethnos-card">
        <h2>Stream Statistics</h2>

        <!-- GROWTH CHART -->
        <div class="chart-wrapper">
          <canvas id="viewer-growth-chart"></canvas>
        </div>

        <!-- KEY STATS -->
        <div class="stats-grid">

          <div class="stat">
            <span class="label">Total Followers:</span>
            <span id="followers" class="value">—</span>
          </div>

          <div class="stat">
            <span class="label">Avg Viewers (30d)</span>
            <span id="avg-viewers-30d" class="value">—</span>
          </div>

          <div class="stat">
            <span class="label">Median Viewers</span>
            <span id="median-viewers-30d" class="value">—</span>
          </div>

          <div class="stat">
            <span class="label">Peak Viewers (30d)</span>
            <span id="peak-viewers-30d" class="value">—</span>
          </div>

        </div>

        <!-- STREAM TIME -->
        <h3>Streaming Time</h3>
        <div class="stats-grid">

          <div class="stat">
            <span class="label">Hours Streamed (30d)</span>
            <span id="hours-streamed-30d" class="value">—</span>
          </div>

          <div class="stat">
            <span class="label">Avg Stream Length</span>
            <span id="avg-stream-length" class="value">—</span>
          </div>

        </div>
      </section>

      <!-- LOGO CARD -->
      <section class="logo-card">
        <img src="img/logo.png" alt="Zethnos Logo" />
      </section>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="live.js"></script>
    <script src="stats.js"></script>
    <script src="chart.js"></script>
  </body>
</html>
